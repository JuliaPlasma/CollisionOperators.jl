# Build the precompiled GPU image (docker/Dockerfile) and push it to GHCR.
# Pods pull ghcr.io/<owner>/collisionoperators instead of installing and
# precompiling Julia packages at boot.

name: Docker

on:
    push:
        branches:
            - main
        paths:
            - docker/**
            - .github/workflows/Docker.yml
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 180
        permissions:
            contents: read
            packages: write
        steps:
            # The depot with CUDA artifacts is several GB; the stock runner is
            # short on disk once the base image and build cache are added.
            - name: Free disk space
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/collisionoperators:latest
                      ghcr.io/${{ github.repository_owner }}/collisionoperators:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true
