# Pin the CUDA toolkit artifacts instead of letting CUDA.jl pick one from the
# driver at first `using CUDA`: the image is built without a GPU, and a pinned
# version is what lets the runtime be downloaded and precompiled at build time.
# 12.8 is the oldest toolkit that supports sm_120 (RTX 5090); pods must run a
# driver >= 570 (CUDA 12.8), which the Runpod template enforces.

[CUDA_Runtime_jll]
version = "12.8"

[CUDA_Compiler_jll]
version = "12.8"
