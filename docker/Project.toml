# Environment baked into the GPU image (see docker/Dockerfile): the package deps
# of ../Project.toml plus CUDA, which main.jl loads only under --use_gpu=true.
# Kept apart from the package Project.toml so CPU users never pull CUDA.

[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
